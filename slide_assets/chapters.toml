status = "仅协调已声明的 Cown · bocpy 为第三方实验"
diagram_reason = "一张 A{x}、B{y} 到 C{x,y} 的图同时表达资源声明和必要顺序；C 的说明补充全部可用、排他执行与释放访问权。"
alt = "Behavior A 声明 Cown x 并更新 x，Behavior B 声明 Cown y 并更新 y，两者可并行；之后提交的 Behavior C 声明两者，等都完成且资源全部可用后排他访问 x、y，结束时释放访问权。"
notes = "Cown 为隔离状态提供显式入口，Behavior 是声明零个或多个 Cown 的一段工作。所有请求齐备才开始函数体，运行期对所需状态排他访问，结束后释放访问机会；不是销毁资源，也不撤销修改。全部可用是模型语义，不表示底层单条 CPU 原子指令，不画成业务先拿一把锁再阻塞等另一把。当前普通 Cown 的 acquire 覆盖读写，不能声称有共享读请求接口；noticeboard/PinnedCown 属于其他 API，不在本页展开。本模型只保证遵守显式资源与隔离规则的访问，不自动管理任意全局变量、数据库、文件、外部锁与阻塞 I/O。bocpy 是第三方实验，当前后端主要使用工作子解释器和 XIData，不是 CPython 统一路线。固定源码 c8f3cebcb6f3e610e8fe8c2a9a78f6c9492ccd1f。 本例明确由同一提交路径依次提交 A、B、C。A 需要 x，B 需要 y，两份隔离状态没有交集，因此 A/B 可并行，但不保证同时开始或固定完成先后。C 同时需要 x、y，等两项前置工作都完成。只保留 A→C 与 B→C，没有 A→B 或全局队列；C 的合并也不是数据库事务，无回滚承诺。普通 Cown 请求仍为排他，即使合并动作看起来只读。复杂程序还存在提交与嵌套产生的因果约束，不能把直接资源集合无交集推成永远无先后依赖。2026 因果论文区分模型必要顺序与实现附加顺序。本页是最小教学例子，不作吞吐或性能比较。 标题采用 bocpy 项目的拼写 Behavior-Oriented Concurrency；论文原题中的英式 Behaviour 保留在引用中。"
sources = ["https://doi.org/10.1145/3622852", "https://github.com/microsoft/bocpy/blob/c8f3cebcb6f3e610e8fe8c2a9a78f6c9492ccd1f/src/bocpy/behaviors.py#L1967", "https://github.com/microsoft/bocpy/blob/c8f3cebcb6f3e610e8fe8c2a9a78f6c9492ccd1f/src/bocpy/worker.py#L24", "https://microsoft.github.io/bocpy/", "https://drops.dagstuhl.de/entities/document/10.4230/LIPIcs.CONCUR.2026.23", "https://github.com/microsoft/bocpy/blob/c8f3cebcb6f3e610e8fe8c2a9a78f6c9492ccd1f/src/bocpy/_core.c#L3710"]
