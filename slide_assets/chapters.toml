code_kind = "可运行反例 · Barrier 固定触发两次计算，末值不固定"
language = "python"
run = true
code = '''
from concurrent.futures import ThreadPoolExecutor
from threading import Barrier

cache = {}
both_checked = Barrier(2)

def get_value(worker):
    if "key" not in cache:
        both_checked.wait()  # 两人都通过检查，再继续
        cache["key"] = worker
        return "built"
    return "hit"

with ThreadPoolExecutor(2) as pool:
    outcomes = list(pool.map(get_value, ["A", "B"]))
assert outcomes == ["built", "built"]
print(outcomes, cache)
'''
alt = "线程 A 和 B 都发现缓存缺失，各自计算后写入同一个 cache；红色覆盖箭头标出两路写入之间的竞态。"
notes = "Barrier 是复现交错的实验仪器，不是修复方案；移除它后问题仍可能发生，但不保证每次复现。具体例子是应用竞态，不是声称 dict 内部内存已损坏。若 build_value 有副作用，重复执行可能比最后覆盖的值更严重。图中检查箭头包含本次访问观察到的结果，省略读取请求与返回的协议细节；此交错以 B 最后写入为例，调换写入顺序则末值改变。应用锁修复见 04-08。"
sources = ["https://docs.python.org/3.14/howto/free-threading-python.html#thread-safety", "https://docs.python.org/3.14/library/threading.html#barrier-objects"]

