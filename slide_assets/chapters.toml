notes = "线程队列传的是同一个对象的引用，不自动复制或转移所有权；示例特意只传不可变成员组成的元组。进程池与解释器池通常序列化重建对象。PEP 814 的 frozendict 在核验日属于 3.15 预发布能力，并且仅浅层不可变；frozendict(items=[]) 内的列表仍可修改。MappingProxyType 是只读视图，不能冒充不可变快照。"
