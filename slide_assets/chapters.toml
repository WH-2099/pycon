code_kind = "可运行 · Python 3.14 · 元组只含不可变值"
language = "python"
run = true
code = '''
from queue import SimpleQueue

def produce(outbox):
    local = {"count": 0}       # 本地维护
    local["count"] += 1
    message = ("count", local["count"])
    outbox.put(message)        # 传递不可变值

outbox = SimpleQueue()
produce(outbox)
snapshot = outbox.get()
assert snapshot == ("count", 1)
print(snapshot)                # 接收方只读
'''
