[slides."02-01-pause"]
section = "第二章 · 一、暂停"
title = "暂停，现场留下来"
takeaway = "yield 交还控制权，局部状态与收尾责任仍然存在。"
status = "PEP 255 → 342 → 380 · Python 2.2 → 2.5 → 3.3"
diagram_reason = "用状态转换区分暂停、恢复与关闭；比单纯历史时间线更能解释保存现场。"
code_kind = "可运行 · Python 3.14 · 输出 READY / HELLO / closed"
language = "python"
run = true
code = '''
def worker():
    try:
        message = yield "READY"
        yield message.upper()
    finally:
        print("closed")

def pipeline():
    yield from worker()

job = pipeline()
print(next(job))          # 暂停，保留 worker 的现场
print(job.send("hello"))  # 继续运行，并传入数据
job.close()              # 委托关闭，进入 finally
'''
alt = "调用者通过 next()/send() 恢复执行，yield 返回调用者；栈帧与局部状态被保留，close() 另指向清理。"
notes = "PEP 255 原始限制针对带 finally 的 try 子句，不是所有 try；PEP 342 才允许这种清理模式。图中的 close 假定已经启动的生成器正确响应 GeneratorExit。throw 可向暂停点注入异常，yield from 还委托异常、关闭与返回值。生成器不承诺 CPU 并行。"
sources = ["https://peps.python.org/pep-0255/", "https://peps.python.org/pep-0342/", "https://peps.python.org/pep-0380/"]

[slides."02-02-wait"]
section = "第二章 · 二、等待"
title = "等结果时，推进别的任务"
takeaway = "await 标出可能的暂停；Task 由事件循环推进。"
status = "PEP 3156 · asyncio / Python 3.4　PEP 492 · async / await / Python 3.5"
diagram_reason = "沿时间纵向展开一次等待，明确同一事件循环先后推进不同任务。"
mermaid = '''
sequenceDiagram
    participant A as Task A
    participant L as 事件循环
    participant B as Task B
    L->>A: 推进协程
    A-->>L: await 尚未就绪的结果
    L->>B: 推进其他工作
    B-->>L: 本次推进结束
    Note over A,L: 等待的结果就绪
    L->>A: 从暂停处继续
'''
code_kind = "可运行 · Python 3.14 · 输出 waiting / other work / resumed"
language = "python"
run = true
code = '''
import asyncio

async def main():
    ready = asyncio.Event()
    async def request():
        print("waiting")
        await ready.wait()
        print("resumed")

    task = asyncio.create_task(request())
    await asyncio.sleep(0)
    print("other work")
    ready.set()
    await task

asyncio.run(main())
'''
alt = "单条时间线上依次执行蓝色任务 A、橙色任务 B、蓝色任务 A；下方弧线标出 A 从 await 到恢复之间的等待跨度。"
notes = "await 不保证每次都让出执行权；等待已经完成的对象可以直接继续。创建协程对象不等于已经创建 Task，也不等于已调度。此处图示普通调度路径；Python 3.14 的 eager_start 还允许创建时立即推进。示例使用事件替代网络，离线可运行。"
sources = ["https://peps.python.org/pep-3156/", "https://peps.python.org/pep-0492/", "https://docs.python.org/3.14/library/asyncio-task.html"]

[slides."02-03-ownership"]
section = "第二章 · 三、归属"
title = "函数返回了，任务归谁？"
takeaway = "创建任务只完成了分叉，还需要交代等待、异常和清理。"
status = "Task 可以超出创建它的函数生命周期"
diagram_reason = "作用域边界呈现任务越界；用一块待明确的责任清单收束问题，不把没有分支的提问画成决策菱形。"
code_kind = "可运行 · Python 3.14 · 输出 response / log written"
language = "python"
run = true
code = '''
import asyncio

async def write_log(ready):
    await ready.wait()
    print("log written")

async def handle_request(ready):
    return asyncio.create_task(write_log(ready))

async def main():
    ready = asyncio.Event()
    task = await handle_request(ready)
    print("response")       # 请求函数已返回
    assert not task.done()  # 日志任务尚未完成
    ready.set()
    await task              # 外层显式接手收尾

asyncio.run(main())
'''
alt = "上方请求函数创建下方日志任务；请求函数在返回时刻结束，日志任务跨过返回虚线继续运行，末端提出谁来收尾。"
notes = "代码刻意把 Task 返回给外层并保留强引用，以确定性展示函数返回后任务仍未完成。它展示手工接手责任，不推荐丢弃 Task 句柄。事件循环只保留 Task 的弱引用；asyncio.run 退出时会取消剩余任务，也不能用它冒充长期后台服务。"
sources = ["https://docs.python.org/3.14/library/asyncio-task.html#asyncio.create_task", "https://vorpus.org/blog/notes-on-structured-concurrency-or-go-statement-considered-harmful/"]

[slides."02-04-taskgroup"]
section = "第二章 · 四、责任"
title = "失败回到父级，清理留在组内"
takeaway = "TaskGroup 离开前，等待它管理的子任务收尾。"
status = "TaskGroup / Python 3.11+　PEP 789 / Draft：继续约束 yield 越界"
diagram_reason = "从子任务运行时开始，保留失败、取消、清理与异常汇总的时间顺序；省略前页已经说明的创建过程。"
mermaid = '''
sequenceDiagram
    participant P as 父任务 / TaskGroup
    participant A as 子任务 A
    participant B as 子任务 B
    Note over P,B: 组内子任务正在运行
    A-->>P: 普通异常
    rect rgb(255,244,230)
        P->>B: 请求取消
        B-->>P: finally 清理完成并结束
    end
    Note over P,B: 所有子任务结束后
    P->>P: 汇总异常，退出
'''
code_kind = "可运行 · Python 3.14 · 输出 cleaned / 1"
language = "python"
run = true
code = '''
import asyncio

async def fail():
    await asyncio.sleep(0)
    raise ValueError("profile failed")

async def sibling():
    try:
        await asyncio.sleep(60)
    finally:
        print("cleaned")

async def main():
    try:
        async with asyncio.TaskGroup() as group:
            group.create_task(fail())
            group.create_task(sibling())
    except* ValueError as errors:
        print(len(errors.exceptions))

asyncio.run(main())
'''
alt = "TaskGroup 虚线边界内，失败引出取消请求，两路经过清理并等待全部结束，之后 ExceptionGroup 才越过边界向外传播。"
notes = "普通非 CancelledError 异常触发取消其他任务；CancelledError 本身不按普通失败处理。KeyboardInterrupt 与 SystemExit 在等待清理后特殊重抛。取消是协作式请求，吞掉取消或一直不让出执行权可能阻碍退出。PEP 789 仍为 Draft，不展示 sys.prevent_yields 为已发布 API；它限制 yield/yield from 而不是 await。"
sources = ["https://docs.python.org/3.14/library/asyncio-task.html#task-groups", "https://peps.python.org/pep-0654/", "https://peps.python.org/pep-0789/"]

[slides."02-05-structure"]
section = "第二章 · 五、组织"
title = "调用栈，长成责任树"
takeaway = "用可嵌套的作用域组织任务，逐层创建，逐层收束。"
status = "结构化编程 → 结构化并发　下一问：任务在哪里执行？"
diagram_reason = "树边只表达归属，创建与收尾由页内结论说明；区分 posts 任务与它内部的任务组，不以重复回边制造控制流回路。"
code_kind = "可运行 · Python 3.14 · 输出 profile / body / comments"
language = "python"
run = true
code = '''
import asyncio

async def posts():
    async with asyncio.TaskGroup() as group:
        body = group.create_task(asyncio.sleep(0, "body"))
        comments = group.create_task(asyncio.sleep(0, "comments"))
    return body.result(), comments.result()

async def page():
    async with asyncio.TaskGroup() as group:
        profile = group.create_task(asyncio.sleep(0, "profile"))
        article = group.create_task(posts())
    return profile.result(), *article.result()

print(asyncio.run(page()))
'''
alt = "页面 TaskGroup 包含 profile 与 posts TaskGroup，posts 内的正文和评论先汇合，随后与 profile 在外层汇合并收束。"
notes = "TaskGroup 只管理通过该组 create_task 创建的任务，不自动收编作用域里任意 asyncio.create_task 产生的任务。责任树不指定核心、不自动提供 CPU 并行。结构化编程的局部可理解性是这里的类比重点，不把历史画成技术淘汰链。"
sources = ["https://docs.python.org/3.14/library/asyncio-task.html#task-groups", "https://vorpus.org/blog/notes-on-structured-concurrency-or-go-statement-considered-harmful/"]

[slides."03-01-processes"]
section = "第三章 · 一、进程"
title = "跨进程，各有一份运行时"
takeaway = "地址空间隔开状态，IPC 连接工作。"
status = "PEP 371 · multiprocessing / Python 2.6　示例使用 ProcessPoolExecutor"
diagram_reason = "进程边框表示地址空间；IPC 和核心连线接到进程边界，避免穿过分组标题，内部对象关系留在框内。"
code_kind = "可运行 · Python 3.14 · 保存为 .py 文件运行"
language = "python"
run = true
code = '''
from concurrent.futures import ProcessPoolExecutor

def square_sum(n):
    return sum(i * i for i in range(n))

if __name__ == "__main__":
    with ProcessPoolExecutor(max_workers=2) as pool:
        results = list(pool.map(square_sum, [1000, 2000]))
    print(results)  # 参数和结果跨进程边界
'''
alt = "进程 A 和 B 各有独立外框，分别包含解释器、GIL 与本地状态，并连接框外不同的 CPU 核心；中间信封表示 IPC 通信。"
notes = "图以通常启用 GIL 的构建为例；自由线程构建也可以启动多个进程。进程不固定绑定特定核心，操作系统决定调度。进程池示例需可导入的主模块和可序列化的函数、参数与结果，不能保证在 REPL 或 marimo 单元格内直接运行。此处不假定 fork；Python 3.14 默认启动方式已发生变化。小示例验证机制，不是性能基准。"
sources = ["https://peps.python.org/pep-0371/", "https://peps.python.org/pep-3148/", "https://docs.python.org/3.14/library/concurrent.futures.html#processpoolexecutor"]

[slides."03-02-interpreters"]
section = "第三章 · 二、解释器"
title = "同一进程，分开解释器状态"
takeaway = "工作线程进入各自解释器，各自持有 GIL。"
status = "PEP 684 / Python 3.12　PEP 734 / Python 3.14"
diagram_reason = "外框是进程，内框是解释器；边界层级直接解释它与多进程的区别。"
code_kind = "可运行 · Python 3.14 · 保存为 .py 文件运行"
language = "python"
run = true
code = '''
from concurrent.futures import InterpreterPoolExecutor

def square_sum(n):
    return sum(i * i for i in range(n))

if __name__ == "__main__":
    with InterpreterPoolExecutor(max_workers=2) as pool:
        results = list(pool.map(square_sum, [1000, 2000]))
    print(results)  # 同一进程，参数与结果仍经 pickle
'''
alt = "同一进程内的解释器 A 和 B 各有线程、GIL 与本地状态，分别连接不同 CPU 核心；橙色箭头经序列化消息从 A 指向 B。"
notes = "此页具体指 InterpreterPoolExecutor 创建的隔离解释器，不宣称任何历史子解释器自动拥有独立 GIL。池通过 pickle 传送 callable、参数和结果。普通可变 Python 对象不直接共用；进程级资源仍在同一进程，多解释器不是安全沙箱，也不等同进程的故障隔离。模块状态迁移铺垫见 PEP 3121、489、630。"
sources = ["https://peps.python.org/pep-0684/", "https://peps.python.org/pep-0734/", "https://docs.python.org/3.14/library/concurrent.futures.html#interpreterpoolexecutor", "https://peps.python.org/pep-3121/", "https://peps.python.org/pep-0489/", "https://peps.python.org/pep-0630/"]

[slides."03-02a-interpreter-state"]
section = "第三章 · 二、解释器 · 状态局部化"
title = "先把状态分开，GIL 才能分开"
takeaway = "运行时与模块实例各管各的状态，进程级资源仍需协调。"
status = "PEP 684 / 3.12 · PEP 687 / 标准库扩展改造 · 模块状态不会自动隔离 C 全局变量"
diagram_reason = "左侧待局部化状态经过重构，右侧进入解释器 A 和 B 各自的运行时、模块状态与 GIL 边界。"
alt = "左侧待局部化状态经过重构，右侧进入解释器 A 和 B 各自的运行时、模块状态与 GIL 边界。"
notes = "PEP 3121 为模块对象提供 C 状态存储，PEP 489 多阶段初始化允许独立模块实例，PEP 573 让扩展方法找到所属模块状态，PEP 630 归纳扩展隔离方法，PEP 687 推进标准库扩展的模块局部状态与所需堆类型改造；PEP 684 将大部分依赖 GIL 的运行时状态移入 PyInterpreterState。不是所有状态都复制，也不是所有静态类型都必须变成堆类型。PEP 683 支撑少量本来不可变的全局对象继续共享。csv.field_size_limit 在一个解释器内的修改不影响另一个，已在 3.14.7 顺序调用验证。文件描述符、环境、外部 C 库仍属于进程级资源。Py_MOD_PER_INTERPRETER_GIL_SUPPORTED 与 Py_MOD_GIL_NOT_USED 是两种不同支持声明，不能互相替代。"
