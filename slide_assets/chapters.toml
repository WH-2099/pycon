code = '''
/* CPython 3.14；省略完整模块定义。 */
static PyModuleDef_Slot slots[] = {
    {Py_mod_gil, Py_MOD_GIL_NOT_USED},
    {0, NULL}
};

static PyObject *first_item(PyObject *items) {
    PyObject *item = PyList_GetItemRef(items, 0);
    if (item == NULL) {
        return NULL;  /* 保留 IndexError / TypeError */
    }
    return item;      /* 新的强引用交给调用方 */
}
/* cp314t 需要单独 wheel；声明本身不会修好竞态。 */
'''
alt = "四个独立模块展示线程 A 和 B 各自的本地字节码、PyList_GetItemRef 强引用、Py_mod_gil 扩展声明，以及 cp314t 标签。"
notes = "原稿“特化时互斥锁、多线程每条字节码只特化一次”来自 PEP 703 早期设计；3.14 使用线程本地字节码，-X tlbc=0 同时禁用该机制与特化。实际 API 是 PyList_GetItemRef 和 PyDict_GetItemRef，不能沿用 v0 的 FetchItem 草案名。未声明支持的扩展默认可触发警告并启用 GIL；显式强制关闭 GIL 会改变这一行为。3.14 无自由线程 stable ABI；PEP 803 的 abi3t 是 3.15 事项，不与 cp314t 混写。"
