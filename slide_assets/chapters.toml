[slides."03-03-threads"]
section = "第三章 · 三、线程"
title = "同一解释器，也能多核执行"
takeaway = "关闭 GIL 后，局部保护与应用同步接手。"
status = "3.13：实验　→　3.14：正式支持、仍可选；需要 free-threaded 构建且 GIL 关闭"
diagram_reason = "从执行位置到线程再到共享对象，形成清楚的横向关系；保护机制收进共享对象标签，避免跨边界连线与分支交叉。"
code_kind = "可运行 · 需要 CPython 3.14t，且运行时 GIL 关闭"
language = "python"
run = true
requires = "free-threaded"
code = '''
import sys
from concurrent.futures import ThreadPoolExecutor

def square_sum(n):
    return sum(i * i for i in range(n))

if __name__ == "__main__":
    if sys._is_gil_enabled():
        raise SystemExit("请用 free-threaded Python，并关闭 GIL")
    with ThreadPoolExecutor(max_workers=2) as pool:
        results = list(pool.map(square_sum, [1000, 2000]))
    print(results)
'''
alt = "标有 GIL 关闭的同一解释器内，线程 A 和 B 共同连接一个共享对象及其局部保护，同时各自连接解释器框外不同的 CPU 核心。"
notes = "可用 uv run --python 3.14t python -X gil=0 example.py 运行提取出的示例；首次获取解释器需要网络，现场须预装。运行时检测应在所需扩展导入后进行。默认 GIL 构建中的扩展也可能释放 GIL 执行原生代码，本章限定 CPU 密集的 Python 代码。无锁计算只使用本地状态，不等于任意共享写入安全。核心连线表示可以同时执行的位置，不表示线程与核心永久绑定；实际调度由操作系统决定。"
sources = ["https://peps.python.org/pep-0703/", "https://peps.python.org/pep-0779/", "https://docs.python.org/3.14/howto/free-threading-python.html"]

