[slides."04-08-lock"]
section = "第四章 · 二、同步 · 回到应用"
title = "完整状态变化，放进锁里"
takeaway = "保护业务不变量，要覆盖检查、计算和写入全过程。"
status = "与前面的竞态反例对应；所有访问遵守同一把锁"
diagram_reason = "与竞态页保持相同的三个角色，以 critical 区块展示同一把锁的两次持有；完整状态变化留在第一个区块内。"
mermaid = '''
sequenceDiagram
    participant A as 线程 A
    participant C as cache
    participant B as 线程 B
    critical A 持有应用锁
        A->>C: 检查：缺失
        A->>A: build_value()
        A->>C: 写入结果
    end
    critical B 获得同一把锁后
        B->>C: 检查：命中
        C-->>B: 返回已有结果
    end
'''
code_kind = "可运行 · Python 3.14 · 两个调用得到同一个缓存对象"
language = "python"
run = true
code = '''
from concurrent.futures import ThreadPoolExecutor
from threading import Lock

cache, lock = {}, Lock()

def get_value(key):
    # ponytail: 一把缓存锁；争用显著时改为按键同步。
    with lock:
        if key not in cache:
            cache[key] = object()  # 代表构建结果
        return cache[key]

with ThreadPoolExecutor(2) as pool:
    a, b = pool.map(get_value, ["key", "key"])
assert a is b
print("one cached object")
'''
alt = "同一把锁保护包含检查、计算、写入三步的完整区域；蓝色线程 A 进入，橙色线程 B 停在区域外等待。"
notes = "这里有意采用一把锁，前提是构建短小且不递归访问同一缓存；不要把它推广到持锁执行未知回调、慢 I/O 或跨服务事务。dict.setdefault(key, build_value()) 会先计算参数，不能避免重复构建。单一所有者加队列是另一种安排顺序的方法，但所有访问者必须共同遵守协议。"
sources = ["https://docs.python.org/3.14/library/threading.html#lock-objects", "https://docs.python.org/3.14/howto/free-threading-python.html#thread-safety"]

